<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OLX Workspace</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app" style="width: 300px; padding: 16px; font-family: Arial;">
      <h2>OLX Workspace</h2>

      <div class="actions">
        <button id="analyzeBtn">📊 Executar Análise</button>
        <button id="scrollBtn">⬇️ Auto-scroll</button>
      </div>

      <div id="crawlBar">
        <button id="crawlBtn">📚 Varrer páginas</button>
        <label>até
          <input type="number" id="maxPages" min="1" max="50" value="5" />
        </label>
        <label><input type="checkbox" id="scrollEach" checked /> rolar cada página</label>
        <label><input type="checkbox" id="skipKnown" checked /> pular os que já estão no DB</label>
        <label><input type="checkbox" id="saveToDb" checked /> salvar no DB</label>
      </div>

      <div id="status"></div>

      <div id="toolbar" hidden>
        <label><input type="checkbox" id="selAllBtn" /> selecionar página</label>
        <button id="selectAllBtn">selecionar todas (0)</button>
        <button id="clearSelBtn" class="ghost" disabled>limpar seleção</button>
        <button id="analyzeSelBtn" disabled>🔎 Analisar selecionados (0)</button>
        <button id="viewDbBtn">🗃️ Ver DB</button>
        <button id="clearDbBtn" class="ghost">limpar DB</button>
      </div>

      <pre id="dbDump" hidden></pre>

      <div id="list"></div>

      <div id="pager" hidden>
        <button id="prevBtn">‹ Anterior</button>
        <span id="pageInfo"></span>
        <button id="nextBtn">Próxima ›</button>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
